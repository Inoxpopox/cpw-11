<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscrições</title>
</head>
<body>
        <header>
      <h1>Inscrições</h1>

      <nav>
        <ul>
          <li><a href="ofinica.html">Oficinas</a></li>
        </ul>
      </nav>
    </header>

   <main>
      <section>
        <h2>Formulário de inscrição</h2>

        <p>Preenche os campos seguintes para escolheres a oficina que gostarias de frequentar. Este formulário é apenas um protótipo e não regista inscrições reais.</p>

        <form action="inscricao.html" method="get">
          <p>
            <label for="nome">Nome *</label>
            <input type="text" id="nome" name="nome" required>
          </p>

          <p>
            <label for="email">Email *</label>
            <input type="email" id="email" name="email" required>
          </p>

          <button type="submit">Testar inscrição</button>
        </form>
      </section>
    </main>

    <footer>
      <p>Inscrição</p>
    </footer>
</body>
</html>
